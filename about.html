<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <div class="container">
          <div class="header__content">
            <div class="header__logo">
              <a href="#" class="header__logo-link">Chat with us</a>
              <a href="#" class="header__logo-link">+420 336 775 664</a>
              <a href="#" class="header__logo-link">info@freshnesecom.com</a>
            </div>
            <ul class="header__nav-list">
              <li class="header__nav-item">
                <a href="#" class="header__nav-link">Blog</a>

              <li class="header__nav-item">

            </ul>
          </div>

            <div class="header__img">
              <img src="./images/header.svg" alt="" />
            </div>
            <div class="header__input">
              <select>
                <option class="header__option">All categories</option>
              </select>
              <input type="text" class="header__search" placeholder="Search Products, categories ..." />

            <div class="header__icon">
              <img src="./images/header-icon.svg" alt="" />

            <ul class="hero__options__list">
                <li class="hero__items">
                    <a href="#">
                        <span>Bakery</span>

                </li>
                <li class="hero__items">
                    <a href="#">
                        <span>Fruit and vegetables</span>
                        <img src="./images/hero-arrow.svg" alt="">

                </li>

                    <a href="#">

                <li class="hero__items">
                    <a href="#">

                    <a href="#">

                    </a>
                </li>
                <li class="hero__items">
                    <a href="#">

                        <img src="./images/hero-arrow.svg" alt="">
                    </a>
                </li>
                <li class="hero__items">
                    <a href="#">
                        <span>Pharmacy</span>
                        <img src="./images/hero-arrow.svg" alt="">
                    </a>
                </li>
            </ul>
            <div class="fruit__block">
                <h2 class="fruit__title">Fruit and vegetables</h2>
                <ul class="fruit__list">
                    <li class="fruit__item">
                        <img src="./images/fruit1.svg" alt="">

                    </li>
                    <li class="fruit__item">
                        <img src="./images/fruit2.svg" alt="">

                    </li>
                    <li class="fruit__item">
                        <img src="./images/fruit3.svg" alt="">

                    </li>

            <div class="fruit__inputs">
